name: PCB.OTF CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and test
        run: make test
      - name: Verify reproducibility
        run: |
          sha256sum dist/PCB.ttf dist/PCB.otf dist/PCB-Color.ttf dist/PCB-Color.otf dist/PCB.woff2 dist/PCB-Color.woff2 > /tmp/pcb-first.sha256
          make clean
          make build
          sha256sum -c /tmp/pcb-first.sha256
